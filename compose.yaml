services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: local-atlas-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - atlas-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  atlas-postgres:
